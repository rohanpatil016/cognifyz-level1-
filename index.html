
<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Task</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>JavaScript Practice</h1>

    <!-- Task 1: Change Button Color -->
    <section>
        <h2>1. Change Button Color</h2>

        <button id="colorBtn" onclick="changeColor()">
            Click Me
        </button>
    </section>

    <!-- Task 2: Greeting Message -->
    <section>
        <h2>2. Greeting Message</h2>

        <button onclick="showGreeting()">
            Show Greeting
        </button>
    </section>

    <!-- Task 3: Simple Calculator -->
    <section>
        <h2>3. Simple Calculator</h2>

        <input type="number" id="num1" placeholder="Enter first number">

        <input type="number" id="num2" placeholder="Enter second number">

        <button onclick="addNumbers()">Add Numbers</button>

        <h3 id="result">Result will appear here</h3>
    </section>

    <script src="script.js"></script>

</body>
</html>
